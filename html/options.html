<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>VLINX Options</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
  <h1 class="align-center">VLINX Options</h1>

  <nav class="page-nav">
    <a href="popup.html" class="nav-item">Главная</a>
    <a href="options.html" class="nav-item active">Настройки</a>
    <a href="domains.html" class="nav-item">Домены</a>
  </nav>

  <div class="margin0-0-16 flex global_proxy">
    <span>Распространять прокси на весь браузер</span>
    <input type="checkbox" id="globalProxy">
  </div>

  <div class="margin0-0-16 flex global_proxy">
    <span>Включить обфускацию (мультиплексирование + фрагментирование)</span>
    <input type="checkbox" id="obfuscation">
  </div>

  <h2>Подписки</h2>
  <table class="flex margin0-0-16">
    <thead><tr class="flex"><th>Название</th><th>Серверы</th><th></th></tr></thead>
    <tbody id="subList"></tbody>
  </table>
  <div class="flex margin0-0-16" style="gap:4px;flex-wrap:nowrap">
    <input id="newSubUrl" placeholder="https://.../sub/..." style="flex:3"/>
    <input id="newSubName" placeholder="Название (опц.)" style="flex:2"/>
  </div>
  <div class="flex margin0-0-16">
    <button id="addSub" class="transition">Добавить подписку</button>
  </div>

  <h2>Мои ключи</h2>
  <table class="flex margin0-0-16">
    <thead><tr class="flex"><th>Название</th><th>Ключ</th><th></th></tr></thead>
    <tbody id="manualList"></tbody>
  </table>
  <div class="flex margin0-0-16" style="gap:4px;flex-wrap:nowrap">
    <input id="newManualName" placeholder="Название (опц.)" style="flex:2"/>
  </div>
  <div class="margin0-0-16">
    <textarea id="newManualKey" placeholder="vless://... или JSON конфиг" rows="4" style="width:100%"></textarea>
  </div>
  <div class="flex margin0-0-16">
    <button id="addManual" class="transition">Добавить ключ</button>
  </div>

  <script src="../js/options.js"></script>
</body>

</html>
