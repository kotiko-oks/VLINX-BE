<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>VLINX</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <h1 class="align-center">VLINX</h1>

  <h2>Current domain: </h2>
  <div id="domainSection" class="margin0-0-16 flex">
      <input id="currentDomain" disabled></input>
      <div id="addDomain" class="btn-add transition hidden btn-"></div>
      <div id="removeDomain" class="btn-recycl transition hidden btn-"></div>
  </div>

  <div class="margin0-0-16">
    <h3>Источник:</h3>
    <div style="display:flex;gap:6px;align-items:center;width:100%;min-width:0">
      <select id="sourceSelect" style="flex:1;min-width:0;padding:8px;border:1px solid #d1d5db;border-radius:6px;font-family:inherit"></select>
      <div id="copySource" class="btn-copy btn-" title="Копировать URL подписки или ключ"></div>
    </div>
  </div>

  <div id="serverSelectContainer" class="margin0-0-16 hidden">
    <h3>Сервер:</h3>
    <div style="display:flex;gap:6px;align-items:center">
      <select id="serverSelect" style="flex:1"></select>
      <div id="copyServer" class="btn-copy btn-" title="Копировать ключ сервера"></div>
    </div>
    <p id="subscriptionInfo" class="sub-info"></p>
  </div>

  <div class="flex">
    <button id="connect" class="transition hidden">Connect</button>
    <button id="disconnect" class="transition hidden">Disconnect</button>
    <a href="options.html" id="options" class="transition">Настройки</a>
    <button id="reset" class="transition" title="Сбросить подключение">Reset</button>
  </div>
  
  <p id="status">Прокси отключен</p>

  <script src="../js/popup.js"></script>
</body>
</html>
